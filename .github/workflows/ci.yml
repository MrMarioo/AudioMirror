name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      # Directory.Build.props turns warnings into errors when CI=true.
      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Runs anywhere, no .NET install needed.
          dotnet publish src/AudioMirror -c Release -r win-x64 -p:PublishSingleFile=true \
            -p:Version="$version" -o out/standalone
          # Small download for machines that already have the .NET 8 Desktop Runtime.
          dotnet publish src/AudioMirror -c Release -r win-x64 -p:PublishSingleFile=true \
            --self-contained false -p:Version="$version" -o out/framework
          mkdir dist
          cp out/standalone/AudioMirror.exe "dist/AudioMirror-$version-win-x64.exe"
          cp out/framework/AudioMirror.exe "dist/AudioMirror-$version-win-x64-net8-runtime.exe"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
